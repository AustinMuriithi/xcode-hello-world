name: iOS CI — Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test (iPhone Simulator)
    # The iOS 27 SDK and simulator are available on this preview image.
    runs-on: xcode-27
    permissions:
      contents: read
      checks: write

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Environment info ────────────────────────────────────────────
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          # Include preview versions installed on the Xcode 27 runner.
          xcode-version: latest

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available iPhone simulators
        run: xcrun simctl list devices available | grep -i iphone || echo "No iPhone simulators listed"

      # ── 3. Select simulator ────────────────────────────────────────────
      - name: Select iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # Write JSON to a unique temp file so Python can read it without stdin conflict
          SIMCTL_JSON=$(mktemp /tmp/simctl.XXXXXX.json)
          trap 'rm -f "$SIMCTL_JSON"' EXIT
          xcrun simctl list devices available --json > "$SIMCTL_JSON"
          SELECTED_SIM=$(python3 - "$SIMCTL_JSON" <<'EOF'
          import sys, json
          try:
              with open(sys.argv[1]) as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Failed to parse simctl output: {e}", file=sys.stderr)
              sys.exit(1)

          preferred_names = [
              "iPhone 17 Pro",
              "iPhone 16 Pro",
              "iPhone 16",
          ]

          def available_iphones(devices):
              return sorted(
                  [d for d in devices if "iPhone" in d.get("name", "") and d.get("isAvailable", False)],
                  key=lambda x: x.get("name", ""),
              )

          # Iterate runtimes newest-first so we pick the latest iOS.
          for runtime_key in sorted(data["devices"].keys(), reverse=True):
              if "iOS" not in runtime_key:
                  continue
              iPhones = available_iphones(data["devices"][runtime_key])
              if not iPhones:
                  continue

              # Explicit deterministic fallback order by preferred model names.
              for preferred in preferred_names:
                  for dev in iPhones:
                      if dev["name"] == preferred:
                          print(f'{dev["name"]}\t{dev["udid"]}\t{runtime_key}')
                          sys.exit(0)

              # Final deterministic fallback for the runtime: alphabetically first iPhone.
              dev = iPhones[0]
              print(f'{dev["name"]}\t{dev["udid"]}\t{runtime_key}')
              sys.exit(0)

          # No iPhone simulator found.
          print("No available iPhone simulator found across iOS runtimes.", file=sys.stderr)
          sys.exit(1)
          EOF
          )
          IFS=$'\t' read -r IPHONE_SIM IPHONE_SIM_UDID IPHONE_RUNTIME <<< "$SELECTED_SIM"
          if [ -z "${IPHONE_SIM:-}" ] || [ -z "${IPHONE_SIM_UDID:-}" ]; then
            echo "::error::Could not select an available iPhone simulator (name/UDID missing)"
            exit 1
          fi
          echo "IPHONE_SIM=$IPHONE_SIM" >> "$GITHUB_ENV"
          echo "IPHONE_SIM_UDID=$IPHONE_SIM_UDID" >> "$GITHUB_ENV"
          echo "IPHONE_RUNTIME=$IPHONE_RUNTIME" >> "$GITHUB_ENV"
          echo "Selected simulator name: $IPHONE_SIM"
          echo "Selected simulator UDID: $IPHONE_SIM_UDID"
          echo "Selected simulator runtime: $IPHONE_RUNTIME"

      # ── 4. Build ────────────────────────────────────────────────────────
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project HelloWorld/HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ── 5. Collect & upload build artifact ─────────────────────────────
      - name: Collect build artifact
        run: |
          set -euo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "HelloWorld.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::HelloWorld.app not found in DerivedData"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/artifacts"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "$RUNNER_TEMP/artifacts/HelloWorld-${{ github.run_number }}.zip"
          echo "Archived: $APP_PATH → $RUNNER_TEMP/artifacts/HelloWorld-${{ github.run_number }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-build-${{ github.run_number }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

      # ── 6. Unit tests ───────────────────────────────────────────────────
      - name: Run unit tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          xcodebuild test \
            -project HelloWorld/HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -destination "platform=iOS Simulator,id=$IPHONE_SIM_UDID" \
            -only-testing HelloWorldTests \
            -resultBundlePath "$GITHUB_WORKSPACE/TestResults/unit-tests.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ── 7. UI tests ─────────────────────────────────────────────────────
      - name: Prepare simulator for UI tests
        run: |
          set -euo pipefail
          echo "Preparing simulator for UI tests: $IPHONE_SIM ($IPHONE_SIM_UDID)"
          SIMCTL_JSON=$(mktemp /tmp/simctl.XXXXXX.json)
          trap 'rm -f "$SIMCTL_JSON"' EXIT
          xcrun simctl list devices --json > "$SIMCTL_JSON"
          SIM_STATE=$(python3 - "$SIMCTL_JSON" "$IPHONE_SIM_UDID" <<'EOF'
          import json, sys
          json_path = sys.argv[1]
          udid = sys.argv[2]
          with open(json_path) as f:
              data = json.load(f)
          for runtime_devices in data.get("devices", {}).values():
              for dev in runtime_devices:
                  if dev.get("udid") == udid:
                      print(dev.get("state", "Unknown"))
                      sys.exit(0)
          print("Unknown")
          EOF
          )
          if [ "$SIM_STATE" != "Booted" ]; then
            xcrun simctl boot "$IPHONE_SIM_UDID"
          fi
          xcrun simctl bootstatus "$IPHONE_SIM_UDID" -b
          xcrun simctl list devices available | grep -F "$IPHONE_SIM_UDID" || true

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project HelloWorld/HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -destination "platform=iOS Simulator,id=$IPHONE_SIM_UDID" \
            -only-testing HelloWorldUITests \
            -resultBundlePath "$GITHUB_WORKSPACE/TestResults/ui-tests.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ── 8. Test reports ─────────────────────────────────────────────────
      # Fork pull requests have read-only tokens, so retain their bundles below
      # without trying to create GitHub Checks.
      - name: Publish unit test report
        if: >-
          ${{ !cancelled() && hashFiles('TestResults/unit-tests.xcresult/Info.plist') != '' &&
              (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: kishikawakatsumi/xcresulttool@v1.7.1
        with:
          path: TestResults/unit-tests.xcresult
          title: Unit test results
          upload-bundles: never

      - name: Publish UI test report
        if: >-
          ${{ !cancelled() && hashFiles('TestResults/ui-tests.xcresult/Info.plist') != '' &&
              (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: kishikawakatsumi/xcresulttool@v1.7.1
        with:
          path: TestResults/ui-tests.xcresult
          title: UI test results
          upload-bundles: never

      - name: Upload test results
        if: ${{ !cancelled() && hashFiles('TestResults/**/Info.plist') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults/*.xcresult
          if-no-files-found: warn
